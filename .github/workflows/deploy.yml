# ──────────────────────────────────────────────────────────────────────────
# Deploy the PrepAI docs site to GitHub Pages.
#
# Free hosting for a PUBLIC docs repo. Builds the Docusaurus site and publishes
# the static `build/` output to the `github-pages` environment. The custom
# domain (static/CNAME → interviewpai-docs.aoneahsan.com) is
# preserved by Docusaurus copying static/ into build/.
#
# Firebase Hosting (firebase.json + .firebaserc) remains available as an
# alternative deploy target — run `yarn firebase:deploy` to use it instead.
# ──────────────────────────────────────────────────────────────────────────

name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel in-progress production runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable Corepack (Yarn)
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build
        run: yarn build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
